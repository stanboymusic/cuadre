<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantente — Decisiones claras, negocios rentables</title>
  <link rel="icon" href="/processed_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================================
   DESIGN TOKENS
   Subject: daily cash/inventory ledger for a small Venezuelan
   business (bolívares + multiple digital payment rails).
   Palette: ledger-ink + gold (currency) + teal (utilidad) + clay (egresos)
   Display: Fraunces (slab-ish serif, ledger-book character)
   Body: IBM Plex Sans · Numbers/amounts: IBM Plex Mono (tabular)
   Signature: the sale ticket renders as a torn paper receipt
   ============================================================ */
    :root {
      --ink: #333232;
      --ink-soft: #675545;
      --paper: #f6f5f0;
      --paper-raised: #ffffff;
      --line: #dcd8cc;
      --line-soft: #eae7dc;
      --gold: #e1b54d;
      --gold-deep: #a67828;
      --gold-tint: #faf2df;
      --teal: #2f6f62;
      --teal-tint: #e0efe9;
      --clay: #b5533c;
      --clay-tint: #f6e2db;
      --sidebar: #333232;
      --sidebar-soft: #50453c;
      --sidebar-text: #d7d3cf;
      --shadow: 0 1px 2px rgba(24, 36, 32, .06), 0 6px 16px -8px rgba(24, 36, 32, .18);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: 'Fraunces', serif;
    }

    button {
      font-family: inherit;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ---------- App shell ---------- */
    #app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 230px;
      flex-shrink: 0;
      background: var(--sidebar);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 22px 20px 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .sidebar-brand .brand-icon {
      width: 40px;
      height: auto;
      display: block;
      margin-bottom: 8px;
    }

    .sidebar-brand .mark {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--gold);
      letter-spacing: .02em;
    }

    .sidebar-brand .sub {
      font-size: 10.5px;
      color: #a89a86;
      margin-top: 3px;
      letter-spacing: .03em;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .nav-group {
      padding: 14px 10px 4px 10px;
    }

    .nav-group-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: #a3937f;
      padding: 6px 10px 6px 10px;
      font-weight: 600;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--sidebar-text);
      font-size: 13.5px;
      font-weight: 500;
      margin: 1px 0;
      user-select: none;
    }

    .nav-item:hover {
      background: var(--sidebar-soft);
    }

    .nav-item.active {
      background: var(--gold);
      color: #241a06;
      font-weight: 600;
    }

    .nav-item .ic {
      width: 17px;
      text-align: center;
      opacity: .9;
      font-size: 14px;
    }

    .sidebar-foot {
      margin-top: auto;
      padding: 14px 20px;
      font-size: 11px;
      color: #8a7c6d;
      border-top: 1px solid rgba(255, 255, 255, .08);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--ink);
      padding: 4px 10px 4px 0;
      line-height: 1;
    }

    .sidebar-backdrop {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--paper-raised);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .topbar h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
    }

    .topbar .rate-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gold-tint);
      color: var(--gold-deep);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .content {
      padding: 24px 28px 60px 28px;
      max-width: 1180px;
    }

    @media(max-width:860px) {
      .menu-btn {
        display: inline-block;
      }

      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100vh;
        width: 230px;
        z-index: 60;
        transition: left .2s ease;
        box-shadow: 0 0 40px rgba(0, 0, 0, .35);
      }

      .sidebar.open {
        left: 0;
      }

      .sidebar-backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .4);
        z-index: 55;
      }

      .content {
        padding: 14px 14px 60px 14px;
      }

      .topbar {
        padding: 10px 14px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .topbar h1 {
        font-size: 16px;
        display: flex;
        align-items: center;
      }

      .topbar .rate-pill {
        font-size: 10.5px;
        padding: 5px 9px;
        gap: 5px;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .overlay {
        padding: 0;
        align-items: stretch;
      }

      .modal {
        max-width: 100%;
        border-radius: 0;
        min-height: 100vh;
      }

      .modal.wide {
        max-width: 100%;
      }

      .ticket {
        width: 100%;
        max-width: 300px;
      }

      .card-pad {
        padding: 14px;
      }
    }

    /* ---------- generic pieces ---------- */
    .card {
      background: var(--paper-raised);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-pad {
      padding: 20px;
    }

    /* ---------- login ---------- */
    .login-wrap {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, var(--gold-tint) 0%, #f3e2ae 45%, var(--gold) 100%);
    }

    .login-wrap::before,
    .login-wrap::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
    }

    .login-wrap::before {
      width: 480px;
      height: 480px;
      top: -140px;
      left: -120px;
      background: var(--gold-deep);
      opacity: .45;
    }

    .login-wrap::after {
      width: 520px;
      height: 520px;
      bottom: -160px;
      right: -140px;
      background: var(--gold);
      opacity: .55;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      text-align: center;
      backdrop-filter: blur(6px);
      background: rgba(255, 255, 255, .92);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin: 0 auto 10px;
      display: block;
    }

    .login-title {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .04em;
      color: var(--ink);
    }

    .login-sub {
      color: var(--ink-soft);
      font-size: 12.5px;
      margin: 2px 0 20px;
    }

    .login-card .field {
      text-align: left;
    }

    .login-error {
      color: var(--clay);
      font-size: 12.5px;
      margin: 4px 0 12px;
      text-align: left;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    @media(max-width:900px) {

      .grid-3,
      .grid-4,
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stat {
      background: var(--paper-raised);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .stat .lbl {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-soft);
      font-weight: 600;
    }

    .stat .val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 24px;
      font-weight: 600;
      margin-top: 6px;
    }

    .stat.pos .val {
      color: var(--teal);
    }

    .stat.neg .val {
      color: var(--clay);
    }

    .stat .sub {
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 28px 0 12px 0;
    }

    .section-title h2 {
      font-size: 17px;
      margin: 0;
      font-weight: 600;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--paper-raised);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      transition: filter .1s;
    }

    .btn:hover {
      filter: brightness(.97);
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .btn-primary:hover {
      background: #26362f;
    }

    .btn-gold {
      background: var(--gold);
      color: #241a06;
      border-color: var(--gold);
    }

    .btn-teal {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    .btn-clay {
      background: transparent;
      color: var(--clay);
      border-color: var(--clay-tint);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13.5px;
      background: #fff;
      color: var(--ink);
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: 2px solid var(--gold);
      outline-offset: 0;
      border-color: var(--gold);
    }

    .field .hint {
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .row-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      font-weight: 600;
      background: var(--line-soft);
      position: sticky;
      top: 0;
    }

    tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line-soft);
    }

    tbody tr:hover {
      background: #fbfaf6;
    }

    .table-wrap {
      max-height: 460px;
      overflow: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: #fff;
    }

    .amt {
      font-family: 'IBM Plex Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .tag-teal {
      background: var(--teal-tint);
      color: var(--teal);
    }

    .tag-clay {
      background: var(--clay-tint);
      color: var(--clay);
    }

    .tag-gold {
      background: var(--gold-tint);
      color: var(--gold-deep);
    }

    .tag-muted {
      background: var(--line-soft);
      color: var(--ink-soft);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-soft);
    }

    .empty .big {
      font-size: 28px;
      margin-bottom: 6px;
    }

    /* modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(21, 31, 27, .5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 5vh 20px;
      z-index: 50;
      overflow-y: auto;
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px -10px rgba(0, 0, 0, .35);
      animation: pop .12s ease-out;
    }

    .modal.wide {
      max-width: 820px;
    }

    @keyframes pop {
      from {
        transform: translateY(6px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line-soft);
    }

    .modal-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-body {
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .x-close {
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 18px;
      color: var(--ink-soft);
      line-height: 1;
      padding: 4px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: var(--shadow);
      z-index: 100;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    .searchbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .searchbar input,
    .searchbar select {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
      background: #fff;
    }

    .searchbar input {
      flex: 1;
      min-width: 160px;
    }

    /* ---------- Ticket (signature element) ---------- */
    .ticket-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }

    .ticket {
      width: 300px;
      background: #fffdf7;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: #26241c;
      padding: 18px 16px 22px 16px;
      position: relative;
      box-shadow: 0 2px 0 #fff, 0 10px 24px -10px rgba(0, 0, 0, .35);
    }

    .ticket:before,
    .ticket:after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 10px;
      background:
        radial-gradient(circle at 6px 5px, transparent 5px, #fffdf7 5.5px) repeat-x;
      background-size: 14px 12px;
    }

    .ticket:before {
      top: -5px;
    }

    .ticket:after {
      bottom: -5px;
      transform: rotate(180deg);
    }

    .ticket .biz {
      text-align: center;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .ticket .biz-sub {
      text-align: center;
      font-size: 10px;
      color: #6b6858;
      margin-bottom: 10px;
    }

    .ticket hr {
      border: none;
      border-top: 1px dashed #c7c2ac;
      margin: 8px 0;
    }

    .ticket .line {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin: 2px 0;
    }

    .ticket .items .line {
      margin: 5px 0;
    }

    .ticket .tot {
      font-weight: 600;
      font-size: 13px;
    }

    .ticket .thanks {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
    }

    /* switch */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--ink);
      border-color: var(--gold);
    }

    .pay-row {
      display: grid;
      grid-template-columns: 1fr 110px 30px;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--line-soft);
      border-radius: 16px;
      padding: 4px 6px 4px 12px;
      font-size: 12px;
    }

    .chip button {
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink-soft);
      font-size: 13px;
      padding: 2px 6px;
    }

    .help-empty-cta {
      margin-top: 10px;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #d8d4c6;
      border-radius: 6px;
    }

    .print-only {
      display: none;
    }

    @media print {

      .sidebar,
      .topbar,
      .no-print {
        display: none !important;
      }

      .content {
        padding: 0;
      }

      body {
        background: #fff;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.22.0/dist/pocketbase.umd.js"></script>
</head>

<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

    <script src="./js/store.js?v=20260817a"></script>
  <script src="./js/auth.js?v=20260817a"></script>
  <script src="./js/app.js?v=20260817a"></script>
  <script src="./js/dashboard.js?v=20260817a"></script>
  <script src="./js/ventas.js?v=20260817a"></script>
  <script src="./js/productos.js?v=20260817a"></script>
  <script src="./js/servicios.js?v=20260817a"></script>
  <script src="./js/proveedores.js?v=20260817a"></script>
  <script src="./js/compras.js?v=20260817a"></script>
  <script src="./js/ajustes.js?v=20260817a"></script>
  <script src="./js/clientes.js?v=20260817a"></script>
  <script src="./js/egresos.js?v=20260817a"></script>
  <script src="./js/cierre.js?v=20260817a"></script>
  <script src="./js/reportes.js?v=20260817a"></script>
  <script src="./js/historial.js?v=20260817a"></script>
  <script src="./js/config.js?v=20260817a"></script>
  <script src="./js/patrimonio.js?v=20260817a"></script>
  <script>
    (async function init() {
      if (!isLoggedIn()) { renderLogin(); return; }
      startIdleWatch();
      await loadDB();
      render();
    })();
  </script>
</body>

</html>
